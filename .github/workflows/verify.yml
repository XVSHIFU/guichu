name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: python -m pip install -r app/requirements-portable.lock
      - run: npm ci --prefix app
      - run: python scripts/verify_agent.py
      - run: python -m unittest discover -s app/tests -p "test_*.py"
      - run: npm --prefix app run build
      - name: Browser regression with isolated workbench
        shell: pwsh
        run: |
          ./app/Start-Workbench.ps1 -NoBrowser
          try {
            # First boot discovers the runner's environment asynchronously.
            # UI suites need the initial snapshot, not just an HTTP listener.
            $scanDeadline = (Get-Date).AddMinutes(4)
            do {
              $workbenchHealth = Invoke-RestMethod 'http://127.0.0.1:8765/api/health'
              if (-not $workbenchHealth.busy) { break }
              if ((Get-Date) -ge $scanDeadline) { throw 'Initial inventory scan did not finish.' }
              Start-Sleep -Seconds 2
            } while ($true)
            npm --prefix app run test:ui:core
            if ($LASTEXITCODE -ne 0) { throw 'Browser regression failed.' }
          } finally {
            ./app/Stop-Workbench.ps1
          }
